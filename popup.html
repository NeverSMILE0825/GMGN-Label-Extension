<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Team Wallet Labels</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <img class="logo" src="icons/icon128.png" alt="" width="40" height="40" />
      <div>
        <h1>Team Wallet Labels</h1>
        <p>For GMGN Ethereum token pages</p>
      </div>
    </header>

    <p id="page-hint" class="hint">Labels apply on GMGN Ethereum token pages.</p>

    <div class="layout">
      <section class="panel" aria-label="Edit a label">
        <div class="field-row">
          <label for="label-name">Label name <span class="example">e.g. ETH, GTA</span></label>
        </div>
        <input id="label-name" type="text" maxlength="32" autocomplete="off" spellcheck="false" placeholder="ETH" />

        <div class="field-row">
          <label for="addresses">Team wallet addresses</label>
          <span id="address-count">0 addresses</span>
        </div>
        <textarea
          id="addresses"
          spellcheck="false"
          placeholder="0x000000000004444c5dc75cb358380d2e3de08a90"
        ></textarea>
        <p class="help">Paste one full 0x Ethereum address per line. Commas and spaces also work.</p>
        <ul id="errors" class="errors"></ul>

        <div class="actions">
          <button id="save" type="button">Save team wallet list</button>
          <button id="clear" type="button">Clear</button>
        </div>
        <p id="status" class="status" role="status"></p>
      </section>

      <aside class="panel saved-panel" aria-label="Saved labels">
        <div class="saved-head">
          <h2>Saved labels</h2>
          <p id="saved-summary">0 labels · 0 wallets</p>
        </div>
        <div id="saved-list" class="saved-list"></div>
      </aside>
    </div>

    <p class="footer">Local only · No wallet connection · No trading access</p>

    <script src="shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
